<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Авторизация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="dark-card">
            <h2>Вход в обитель</h2>
            <p>Для идентификации личности подтвердите свой аккаунт через Telegram.</p>
            
            <!-- Официальный виджет авторизации через вашего бота -->
            <script async src="https://telegram.org" 
                    data-telegram-login="ChainGradusBot" 
                    data-size="large" 
                    data-radius="4" 
                    data-onauth="onTelegramAuth(user)" 
                    data-request-access="write"></script>
        </div>
    </div>
    <script>
        // Функция срабатывает, когда человек успешно нажал "Войти через Telegram"
        function onTelegramAuth(user) {
            localStorage.setItem('tg_logged_user', JSON.stringify(user));
            window.location.href = 'profile.html';
        }
        
        // Защита: если сессия уже есть, сразу кидаем в профиль
        if (localStorage.getItem('tg_logged_user')) {
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
