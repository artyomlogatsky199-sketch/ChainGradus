<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Вход в обитель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
        body { background: #0a0a0a; color: #cccccc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .dark-box { background: #121212; border: 1px solid #261212; border-top: 3px solid #731c1c; padding: 40px 30px; border-radius: 6px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        h2 { color: #d93636; font-size: 24px; margin-bottom: 15px; font-weight: 500; letter-spacing: 0.5px; }
        p { color: #808080; font-size: 14px; line-height: 1.6; margin-bottom: 30px; }
        .go-btn { display: block; background: #8c1f1f; color: #fff; text-decoration: none; padding: 14px 20px; border-radius: 4px; font-weight: bold; font-size: 15px; transition: 0.2s; border: 1px solid #3d1414; }
        .go-btn:hover { background: #b32727; box-shadow: 0 0 15px rgba(179,39,39,0.3); }
        .status-text { margin-top: 20px; font-size: 12px; color: #555; font-style: italic; }
    </style>
</head>
<body>
    <div class="dark-box">
        <h2>Вход в обитель</h2>
        <p>Для безопасной идентификации нажмите кнопку ниже и запустите нашего официального бота в Telegram.</p>
        
        <a id="auth-link" href="#" target="_blank" class="go-btn">АВТОРИЗОВАТЬСЯ ЧЕРЕЗ TELEGRAM</a>
        <div class="status-text">Ожидание подтверждения от бота...</div>
    </div>

       <script>
        // Генерируем случайный уникальный токен сессии
        const authCode = Math.random().toString(36).substring(2, 10) + Date.now().toString().substring(8);
        
        // Используем рабочее зеркало telegram.me вместо заблокированного t.me
        document.getElementById('auth-link').href = `https://telegram.me{authCode}`;

        // Каждую секунду опрашиваем бэкенд на предмет подтверждения входа
        const checkInterval = setInterval(async () => {
            try {
                const res = await fetch('/api/check-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: authCode })
                });
                const data = await res.json();
                
                if (data.success && data.user) {
                    clearInterval(checkInterval);
                    localStorage.setItem('tg_logged_user', JSON.stringify(data.user));
                    window.location.href = 'profile.html';
                }
            } catch (e) {}
        }, 1500);

        if (localStorage.getItem('tg_logged_user')) window.location.href = 'profile.html';
    </script>
</body>
</html>
