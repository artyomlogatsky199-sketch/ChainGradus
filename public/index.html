<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Вход в обитель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
        body { background: #0a0a0a; color: #cccccc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .dark-box { background: #121212; border: 1px solid #261212; border-top: 3px solid #731c1c; padding: 40px 30px; border-radius: 6px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        h2 { color: #d93636; font-size: 24px; margin-bottom: 15px; font-weight: 500; letter-spacing: 0.5px; }
        p { color: #808080; font-size: 14px; line-height: 1.6; margin-bottom: 30px; }
        .tg-wrapper { display: inline-block; min-height: 40px; width: 100%; }
        .error-hint { display: none; color: #a63232; font-size: 13px; margin-top: 15px; line-height: 1.5; background: #1a0b0b; padding: 12px; border-radius: 4px; border: 1px solid #3d1414; }
    </style>
</head>
<body>
    <div class="dark-box">
        <h2>Вход в обитель</h2>
        <p>Для подтверждения личности авторизуйтесь через официальный шлюз Telegram.</p>
        
        <div class="tg-wrapper">
            <!-- Официальный виджет -->
            <script async src="https://telegram.org" 
                    data-telegram-login="ChainGradusBot" 
                    data-size="large" 
                    data-radius="4" 
                    data-onauth="onTelegramAuth(user)" 
                    data-request-access="write"></script>
            
            <!-- Подсказка вместо гостевой кнопки -->
            <div id="block-hint" class="error-hint">
                ⚠️ Кнопка авторизации заблокирована вашей сетью или браузером.<br><br>
                <strong>Как исправить:</strong> Откройте сайт в <u>режиме Инкогнито</u> или зайдите с телефона через <u>мобильный интернет (не Wi-Fi)</u>.
            </div>
        </div>
    </div>

    <script>
        function onTelegramAuth(user) {
            localStorage.setItem('tg_logged_user', JSON.stringify(user));
            window.location.href = 'profile.html';
        }

        // Если виджет вырезан сетью провайдера, показываем только инструкцию исправления
        setTimeout(() => {
            const iframe = document.querySelector('iframe[id^="tg-iframe"]') || document.querySelector('.tgme_widget_login');
            if (!iframe) {
                document.getElementById('block-hint').style.display = 'block';
            }
        }, 3000);

        if (localStorage.getItem('tg_logged_user')) window.location.href = 'profile.html';
    </script>
</body>
</html>
